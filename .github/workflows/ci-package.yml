name: RyGTS CI package
run-name: RyGTS development CI build
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this commit is already packaged
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: rygt-development-package
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: source
        env:
          FORCE_BUILD: ${{ inputs.force }}
        run: python3 ci/registry_ci.py resolve
  windows:
    needs: source
    if: needs.source.outputs.needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Fetch exact GitLab source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA' }
          New-Item -ItemType Directory -Force C:/rygt-ci | Out-Null
          Set-Location C:/rygt-ci
          git init
          git config core.longpaths true
          git remote add origin https://gitlab.com/rygt-team/RyGTS.git
          git fetch --depth=1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE) { throw 'GitLab fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -or (git rev-parse HEAD) -cne $env:SOURCE_SHA) { throw 'Source mismatch' }
      - name: Build launcher and renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:/rygt-ci
          python -m unittest discover -s ci/tests -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'CI regression tests failed' }
          . ./ci/setup-hosted-windows.ps1
          & ./ci/build-windows.ps1 -Target Launcher
          & ./ci/build-windows.ps1 -Target Renderer -Flavor Release
          & ./ci/build-windows.ps1 -Target Launcher -Flavor Diagnostics
          & ./ci/build-windows.ps1 -Target Renderer -Flavor Diagnostics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ needs.source.outputs.commit }}
          path: C:/rygt-ci/artifacts/
          if-no-files-found: error
          retention-days: 7
  tests:
    needs: source
    if: needs.source.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ needs.source.outputs.commit }}
    steps:
      - name: Fetch exact GitLab source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          cd source
          git remote add origin https://gitlab.com/rygt-team/RyGTS.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build and test converter
        working-directory: source
        run: |
          python3 -m unittest discover -s ci/tests -p 'test_*.py'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
          cmake --preset linux-release-cli
          cmake --build --preset linux-release-cli --parallel 2
          ctest --test-dir build/linux-release-cli --output-on-failure --no-tests=error --output-junit converter-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: converter-tests-${{ needs.source.outputs.commit }}
          path: source/converter-tests.xml
          retention-days: 7
  package:
    needs: [source, windows, tests]
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch exact GitLab source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          cd source
          git remote add origin https://gitlab.com/rygt-team/RyGTS.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-${{ needs.source.outputs.commit }}
          path: source/artifacts/
      - name: Assemble and validate separate Release and Debug packages
        working-directory: source
        env:
          CI_COMMIT_SHA: ${{ needs.source.outputs.commit }}
          CI_PIPELINE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 ci/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ needs.source.outputs.commit }}
          path: |
            source/dist/RyGTS-ci-*.zip
            source/dist/RyGTS-ci-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-ci-${{ needs.source.outputs.commit }}
          path: |
            source/dist/RyGTS-debug-ci-*.zip
            source/dist/RyGTS-debug-ci-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-manifest-${{ needs.source.outputs.commit }}
          path: source/dist/CI-PACKAGES.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish ci and debug-ci packages to GitLab
        env:
          GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
        run: python3 ci/registry_ci.py publish
